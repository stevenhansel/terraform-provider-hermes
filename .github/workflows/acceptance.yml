name: Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Hermes acceptance tests
    runs-on: ubuntu-latest
    env:
      TF_ACC: "1"
      HERMES_ACC_ENDPOINT: ${{ secrets.HERMES_ACC_ENDPOINT }}
      HERMES_ACC_USERNAME: ${{ secrets.HERMES_ACC_USERNAME }}
      HERMES_ACC_PASSWORD: ${{ secrets.HERMES_ACC_PASSWORD }}
      HERMES_ACC_PROFILE: ${{ secrets.HERMES_ACC_PROFILE }}
      HERMES_ACC_BASE_URL: ${{ secrets.HERMES_ACC_BASE_URL }}
      HERMES_ACC_MODEL: ${{ secrets.HERMES_ACC_MODEL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Run acceptance tests
        run: make test-acc
